<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP MACHINE A SOUS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0"></script>
    <link rel='stylesheet' href='css/style.css'>
    <script type="text/javascript" src="js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="case-container">
            <div class="case">
                <p class="launch-point">10</p>
                <img class="points-money-img" src="img/points.svg"/>
            </div>
            <div class="case">
                <p class="win-point">0</p>
                <img class="points-money-img" src="img/money.svg"/>
            </div>
        </div>
        <p class="tittle">CASINO</p>
        <div class="images-container">
            <img class="images1" src="img/7.png"/>
            <img class="images2" src="img/de.png"/>
            <img class="images3" src="img/cerises.png"/>
        </div>
        <button class="launch">Lancer</button>
        <button class="relod-page">Réintialiser</button>
        <div class="visuel-container">
            <img class="visuel" src="img/visuel1.png">
            <img class="visuel" src="img/visuel2.png">
            <img class="visuel" src="img/visuel3.png">
            <img class="visuel" src="img/visuel4.png">
            <img class="visuel" src="img/visuel5.png">
        </div>
    </div>
</body>
</html>
